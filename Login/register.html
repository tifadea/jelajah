<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Register Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
  </head>
  <body>
    <div class="bg-img">
      <div class="content">
        <header>Register Form</header>
        <form id="registerForm" action="#">
          <div class="field">
            <span class="fa fa-user"></span>
            <input type="text" id="username" required placeholder="Username">
          </div>
          <div class="field space">
            <span class="fa fa-envelope"></span>
            <input type="email" id="email" required placeholder="Email">
          </div>
          <div class="field space">
            <span class="fa fa-lock"></span>
            <input type="password" id="password" class="pass-key" required placeholder="Password">
          </div>
          <div class="field">
            <button type="submit" style="width:100%;height:45px;background:#3498db;border:1px solid #2691d9;color:white;font-size:18px;cursor:pointer;font-family:Montserrat,sans-serif;">REGISTER</button>
          </div>
        </form>
        <div class="signup">Sudah punya akun?
          <a href="index.html">Login</a>
        </div>
      </div>
    <div id="message" style="color:white;margin-top:10px;text-align:center;"></div>
    <script src="js/register.js"></script>
  </body>
</html>
